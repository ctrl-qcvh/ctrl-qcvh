<script>// Generate all 28-bit binary strings with exactly two '1's
const bits = 28;
let index = 0;

for (let i = 0; i < bits; i++) {
  for (let j = i + 1; j < bits; j++) {
    // Create an array of zeros
    let arr = Array(bits).fill('0');
    arr[i] = '1';
    arr[j] = '1';
    let binStr = arr.join('');

    // Convert to base-10 integer
    let decimalVal = parseInt(binStr, 2);

    // Print as: index, binary, decimal
    console.log(`"ccurrent year"+${index}, ${binStr}, ${decimalVal}`);
    document.getElementById("bodyDates").innerHTML+=(`"date from current year"+${index}, ${binStr}, ${decimalVal}`);
    //document.getElementById(bodyDates).innerHTML+="<p><\/p>"
    index++;
  }
}
